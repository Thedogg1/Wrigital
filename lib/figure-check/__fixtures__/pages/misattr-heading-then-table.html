<!DOCTYPE html>
<html lang="en-GB">
<head><title>Boundary prose then table</title></head>
<body>
  <main>
    <h2>Income tax personal allowance</h2>
    <p>
      Most people can earn up to the personal allowance before paying income tax.
      The examples below are illustrative only.
    </p>
    <table>
      <tr><th>Wrapper</th><th>Income</th><th>Tax paid</th></tr>
      <tr><td>ISA</td><td>£30,000</td><td>£0</td></tr>
      <tr><td>General account</td><td>£30,000</td><td>£3,486</td></tr>
    </table>
  </main>
</body>
</html>
